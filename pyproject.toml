[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "e2d"
version = "1.0.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "transformers>=4.47.0",
    "tokenizers>=0.21.0",
    "sentencepiece>=0.2.0",
    "shortuuid>=1.0.13",
    "accelerate>=1.2.0",
    "peft>=0.14.0",
    "bitsandbytes>=0.45.0",
    "pydantic>=2.10.0",
    "markdown2[all]>=2.5.0",
    "numpy>=1.26.4,<2.1.0",
    "scikit-learn>=1.6.0",
    "requests>=2.32.0",
    "httpx>=0.28.0",
    "uvicorn>=0.34.0",
    "fastapi>=0.115.0",
    "einops>=0.8.0",
    "einops-exts>=0.0.4",
    "timm>=1.0.12",
    "datasets>=3.2.0",
    "gradio>=5.7.0",
    "pillow>=11.0.0",
    "protobuf>=5.29.0",
    "huggingface-hub>=0.27.0",
]

[project.optional-dependencies]
train = ["deepspeed>=0.16.3", "ninja>=1.11.1", "wandb>=0.19.0"]
build = ["build", "twine"]

[tool.setuptools.packages.find]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*", "amlt*", "data*"]

[tool.wheel]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*", "amlt*", "data*"]

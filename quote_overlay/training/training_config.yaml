# Quote Overlay Model Training Configuration

# Model Configuration
model:
  base_model: "meta-llama/Llama-3.2-3B"
  vision_tower: "openai/clip-vit-large-patch14-336"
  mm_vision_select_layer: -2
  mm_vision_select_feature: "patch"
  mm_projector_type: "mlp2x_gelu"

# LoRA Configuration
lora:
  enable: true
  r: 64  # Rank
  alpha: 16  # Scaling factor
  dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

# Training Arguments
training:
  output_dir: "./checkpoints/quote_v1"
  num_train_epochs: 5
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4  # Effective batch size = 32
  learning_rate: 2.0e-4
  mm_projector_lr: 2.0e-5  # Lower LR for projector
  warmup_steps: 500
  weight_decay: 0.01
  max_grad_norm: 1.0

  # Optimization
  optim: "adamw_torch"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

  # Mixed Precision
  fp16: true
  bf16: false

  # Memory Optimization
  gradient_checkpointing: true

  # Logging & Saving
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 500
  save_total_limit: 3
  evaluation_strategy: "steps"
  eval_steps: 500
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"

  # DeepSpeed (optional)
  deepspeed: null  # Set path to deepspeed config if using

  # Other
  remove_unused_columns: false
  dataloader_num_workers: 4
  seed: 42

# Data Configuration
data:
  train_data_path: "./data/llava_format/train.json"
  val_data_path: "./data/llava_format/validation.json"
  test_data_path: "./data/llava_format/test.json"
  image_folder: "./data/crello_images"

  # Image preprocessing
  image_aspect_ratio: "square"

  # Tokenizer
  model_max_length: 2048

# Experiment Tracking (optional)
wandb:
  enabled: false  # Set to true to enable Weights & Biases logging
  project: "quote-overlay"
  name: "quote_v1"
  entity: null  # Your W&B username/team

# Hardware
hardware:
  device: "cuda"  # cuda, mps, or cpu
  num_gpus: 4  # Number of GPUs to use
